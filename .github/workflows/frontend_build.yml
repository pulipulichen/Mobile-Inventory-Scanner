name: Frontend build

on:
  # push:
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend apps
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Podman is available
        shell: bash
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman --version

      - name: Build scan and print apps
        env:
          MIS_FRONTEND_NON_INTERACTIVE: "1"
        run: ./frontend_build.sh

      - name: Upload scan build
        uses: actions/upload-artifact@v4
        with:
          name: scan-dist
          path: scan/dist
          if-no-files-found: error

      - name: Upload print build
        uses: actions/upload-artifact@v4
        with:
          name: print-dist
          path: print/dist
          if-no-files-found: error
