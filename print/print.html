<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6feb">
  <title>QR Code 列印｜Mobile Inventory Scanner</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="app-header no-print">
    <a href="./index.html">← 首頁</a>
    <h1>QR Code 產生與列印</h1>
  </header>
  <main class="container">
    <section class="toolbar no-print">
      <button id="sign-in">登入 Google</button>
      <button id="load-data" disabled>讀取 Google Sheet</button>
      <label class="field">
        <span>QR Code 大小：<strong id="qr-size-value">35 mm</strong></span>
        <input id="qr-size" type="range" min="20" max="80" step="1" value="35">
      </label>
      <button id="download-pdf" disabled>產生 PDF</button>
      <button id="print-page" class="secondary" disabled>瀏覽器列印</button>
    </section>
    <div id="status" class="status no-print">請先登入 Google。</div>
    <section id="labels" class="labels" aria-label="QR Code labels"></section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
  <script src="./config/google-sheet.js"></script>
  <script src="./js/google-sheet.js"></script>
  <script src="./js/print.js"></script>
</body>
</html>
